<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Fritz EV - Cart</title></head><body><p><a href="index.html">Home</a> | <a href="checkout.html">Checkout</a></p><h1>Your cart</h1><p id="message">Loading...</p><table border="1"><thead><tr><th>Vehicle</th><th>Options</th><th>Quantity</th><th>Total</th><th></th></tr></thead><tbody id="items"></tbody></table><p id="total"></p><script>let csrfToken='';const money=n=>'$'+Number(n).toLocaleString('en-CA',{minimumFractionDigits:2});async function load(){csrfToken=(await (await fetch('/api/auth/csrf',{credentials:'include'})).json()).token;const r=await fetch('/api/cart',{credentials:'include'});if(!r.ok){message.textContent='Please sign in first.';return}const c=await r.json();message.textContent=c.items.length?'':'Your cart is empty.';items.innerHTML='';c.items.forEach(i=>{const tr=document.createElement('tr');[i.title,i.options.join(' / ')||'Standard',i.quantity,money(i.lineTotal)].forEach(x=>{const td=document.createElement('td');td.textContent=x;tr.append(td)});const td=document.createElement('td');const del=document.createElement('button');del.textContent='Remove';del.onclick=async()=>{await fetch('/api/cart/items/'+i.itemId,{method:'DELETE',credentials:'include',headers:{'X-XSRF-TOKEN':csrfToken}});load()};td.append(del);tr.append(td);items.append(tr)});total.textContent='Total: '+money(c.total)}load()</script></body></html>
