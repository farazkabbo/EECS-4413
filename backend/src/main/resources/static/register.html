<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Fritz EV - Register</title></head><body>
<p><a href="index.html">Home</a></p><h1>Create an account</h1><p id="message"></p>
<form id="form"><input name="username" placeholder="Username" required minlength="3"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required minlength="8"><input name="firstName" placeholder="First name"><input name="lastName" placeholder="Last name"><fieldset><legend>Billing</legend><input name="b.street" placeholder="Street" required><input name="b.city" placeholder="City" required><input name="b.province" placeholder="Province" required><input name="b.country" value="Canada"><input name="b.postalCode" placeholder="Postal code" required><input name="b.phone" placeholder="Phone"></fieldset><fieldset><legend>Shipping</legend><input name="s.street" placeholder="Street" required><input name="s.city" placeholder="City" required><input name="s.province" placeholder="Province" required><input name="s.country" value="Canada"><input name="s.postalCode" placeholder="Postal code" required><input name="s.phone" placeholder="Phone"></fieldset><button>Register</button></form>
<script>let csrfToken='';async function csrf(){csrfToken=(await (await fetch('/api/auth/csrf',{credentials:'include'})).json()).token}const address=(d,p)=>({street:d[p+'.street'],city:d[p+'.city'],province:d[p+'.province'],country:d[p+'.country'],postalCode:d[p+'.postalCode'],phone:d[p+'.phone']});csrf();form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));const body={username:d.username,email:d.email,password:d.password,firstName:d.firstName,lastName:d.lastName,billing:address(d,'b'),shipping:address(d,'s')};const r=await fetch('/api/auth/register',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-XSRF-TOKEN':csrfToken},body:JSON.stringify(body)});message.textContent=r.ok?'Registered. You can now sign in.':await r.text();if(r.ok)form.reset()}</script></body></html>
