<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Fritz EV - Sign in</title></head><body> 
<p><a href="index.html">Home</a></p><h1>Sign in</h1><p id="message"></p> 
<form id="form"><label>Username <input name="username" required></label><br><label>Password <input name="password" type="password" required></label><br><button>Sign in</button></form><p>New customer? <a href="register.html">Register</a></p> 
<script>let csrfToken='';async function csrf(){csrfToken=(await (await fetch('/api/auth/csrf',{credentials:'include'})).json()).token}csrf();form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-XSRF-TOKEN':csrfToken},body:JSON.stringify(Object.fromEntries(new FormData(form)))});message.textContent=r.ok?'Signed in.':'Sign-in failed: '+await r.text();if(r.ok)location.href='cart.html'}</script></body></html>
