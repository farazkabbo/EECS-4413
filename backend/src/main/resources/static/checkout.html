<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Fritz EV - Checkout</title></head><body><p><a href="cart.html">Cart</a></p><h1>Checkout</h1><p id="message">Loading...</p><div id="summary"></div><form id="form" hidden><fieldset><legend>Shipping</legend><input name="street" placeholder="Street" required><input name="city" placeholder="City" required><input name="province" placeholder="Province" required><input name="country" value="Canada"><input name="postalCode" placeholder="Postal code" required><input name="phone" placeholder="Phone"></fieldset><fieldset><legend>Payment</legend><input name="holderName" placeholder="Cardholder name" required><input name="cardNumber" placeholder="Card number" pattern="[0-9]{13,19}" required><input name="expiry" placeholder="MM/YY" required><input name="cvv" placeholder="CVV" pattern="[0-9]{3,4}" required></fieldset><button>Place order</button></form><script>let checkout,csrfToken='';const money=n=>'$'+Number(n).toLocaleString('en-CA',{minimumFractionDigits:2});(async()=>{csrfToken=(await (await fetch('/api/auth/csrf',{credentials:'include'})).json()).token;const r=await fetch('/api/checkout/start',{method:'POST',credentials:'include',headers:{'X-XSRF-TOKEN':csrfToken}});if(!r.ok){message.textContent=await r.text();return}checkout=await r.json();summary.textContent='Total: '+money(checkout.cart.total);form.hidden=false;if(checkout.defaultShipping)Object.keys(checkout.defaultShipping).forEach(k=>form.elements[k].value=checkout.defaultShipping[k]||'')})();form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));const address={street:d.street,city:d.city,province:d.province,country:d.country,postalCode:d.postalCode,phone:d.phone};await fetch('/api/checkout/'+checkout.checkoutId+'/shipping',{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json','X-XSRF-TOKEN':csrfToken},body:JSON.stringify(address)});const card={holderName:d.holderName,cardNumber:d.cardNumber,expiry:d.expiry,cvv:d.cvv};const r=await fetch('/api/checkout/'+checkout.checkoutId+'/place-order',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-XSRF-TOKEN':csrfToken},body:JSON.stringify({card})});message.textContent=(await r.json()).message;form.reset()}</script></body></html>
