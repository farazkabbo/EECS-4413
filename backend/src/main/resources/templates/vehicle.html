<!DOCTYPE html> 
<html lang="en" xmlns:th="http://www.thymeleaf.org"> 
<head><meta charset="UTF-8"><title th:text="|${vehicle.brand} ${vehicle.model} - Fritz EV|">Vehicle</title></head> 
<body> 
<p><a href="/catalog">Catalogue</a></p> 
<h1 th:text="|${vehicle.modelYear} ${vehicle.brand} ${vehicle.model} ${vehicle.trimName ?: ''}|">Vehicle</h1> 
<p th:text="${vehicle.description}"></p> 
<table border="1"> 
  <tbody> 
  <tr><th>Price</th><td th:text="${vehicle.dealPrice != null ? vehicle.dealPrice : vehicle.price}"></td></tr> 
  <tr><th>Condition</th><td th:text="${vehicle.condition}"></td></tr> 
  <tr><th>Shape</th><td th:text="${vehicle.shape}"></td></tr> 
  <tr><th>Range (km)</th><td th:text="${vehicle.rangeKm}"></td></tr> 
  <tr><th>Battery (kWh)</th><td th:text="${vehicle.batteryKwh}"></td></tr> 
  <tr><th>Energy consumption (kWh/100 km)</th><td th:text="${vehicle.energyKwhPer100km}"></td></tr> 
  <tr><th>Mileage (km)</th><td th:text="${vehicle.mileageKm}"></td></tr> 
  <tr><th>Battery health (%)</th><td th:text="${vehicle.batteryHealthPct}"></td></tr> 
  <tr><th>Drivetrain</th><td th:text="${vehicle.drivetrain}"></td></tr> 
  <tr><th>Seats</th><td th:text="${vehicle.seats}"></td></tr> 
  <tr><th>Rating</th><td th:text="${vehicle.averageRating != null ? vehicle.averageRating : 'No reviews'}"></td></tr> 
  </tbody> 
</table> 
<section th:if="${vehicle.history != null}"> 
  <h2>Used-vehicle history report</h2> 
  <p th:text="${vehicle.history.reportSummary}"></p> 
  <p th:text="|Accidents: ${vehicle.history.accidentCount}; damage reported: ${vehicle.history.damageReported}; previous owners: ${vehicle.history.previousOwners}; service records: ${vehicle.history.serviceRecords}|"></p> 
</section> 
<h2>Customization options</h2> 
<section th:each="group : ${vehicle.options}"> 
  <h3 th:text="${group.key}"></h3> 
  <ul><li th:each="option : ${group.value}" th:text="|${option.name} (+${option.priceDelta})|"></li></ul> 
</section> 
<p><a th:href="@{/vehicles/{id}/configure(id=${vehicle.id})}">Configure options</a></p> 
<p><a th:href="@{/vehicles/{id}/loan(id=${vehicle.id})}">Loan calculator</a></p> 
<p><a th:href="@{/vehicles/{id}/savings(id=${vehicle.id})}">Fuel savings and CO2 estimator</a></p> 
<!-- TODO(Zaaid): connect an HTML add-to-cart form; the existing cart endpoint accepts JSON. --> 
<p><button type="button" disabled>Add to cart</button></p> 
<p><a href="/api/cart">View cart (cart API)</a></p> 
</body> 
</html>
