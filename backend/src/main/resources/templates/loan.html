<!DOCTYPE html> 
<html lang="en" xmlns:th="http://www.thymeleaf.org"> 
<head><meta charset="UTF-8"><title>Loan calculator - Fritz EV</title></head> 
<body> 
<p><a th:href="@{/vehicles/{id}(id=${vehicle.id})}">Vehicle details</a></p> 
<h1 th:text="|Loan calculator: ${vehicle.brand} ${vehicle.model}|">Loan calculator</h1> 
<p th:if="${error}" th:text="${error}"></p> 
<form method="post" th:action="@{/vehicles/{id}/loan(id=${vehicle.id})}"> 
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"> 
  <p>Vehicle price: <span th:text="${vehicle.dealPrice != null ? vehicle.dealPrice : vehicle.price}"></span></p> 
  <label>Down payment <input type="number" name="downPayment" min="0" step="0.01" value="0" required></label><br> 
  <label>Annual interest rate (%) <input type="number" name="annualRatePercent" min="0" max="30" step="0.01" value="5" required></label><br> 
  <label>Term (months) <input type="number" name="months" min="1" max="120" value="60" required></label><br> 
  <button type="submit">Calculate</button> 
</form> 
<section th:if="${quote != null}"> 
  <h2>Loan estimate</h2> 
  <p th:text="|Principal: ${quote.principal}|"></p> 
  <p th:text="|Monthly payment: ${quote.monthlyPayment}|"></p> 
  <p th:text="|Total paid: ${quote.totalPaid}|"></p> 
  <p th:text="|Total interest: ${quote.totalInterest}|"></p> 
</section> 
</body> 
</html>
