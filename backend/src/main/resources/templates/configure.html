<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Configure vehicle - Fritz EV</title></head>
<body>
<p><a th:href="@{/vehicles/{id}(id=${vehicle.id})}">Vehicle details</a></p>
<h1 th:text="|Configure ${vehicle.brand} ${vehicle.model}|">Configure vehicle</h1>
<p th:if="${error}" th:text="${error}"></p>
<form method="post" th:action="@{/vehicles/{id}/configure(id=${vehicle.id})}">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  <section th:each="group : ${options}">
    <h2 th:text="${group.key}"></h2>
    <label th:each="option : ${group.value}">
      <input type="checkbox" name="optionIds" th:value="${option.id}">
      <span th:text="|${option.name} - ${option.priceDelta}|"></span><br>
    </label>
  </section>
  <button type="submit">Calculate configuration</button>
</form>
<section th:if="${configuration != null}">
  <h2>Configuration total</h2>
  <p th:text="|Base price: ${configuration.basePrice}|"></p>
  <ul><li th:each="option : ${configuration.options}" th:text="|${option.name}: ${option.priceDelta}|"></li></ul>
  <p th:text="|Options total: ${configuration.optionsTotal}|"></p>
  <p th:text="|Total price: ${configuration.total}|"></p>
</section>
</body>
</html>
