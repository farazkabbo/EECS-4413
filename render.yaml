# Render Blueprint: deploys the API (Docker) and the React front end (static site).
# Render dashboard > New > Blueprint > pick this repo. Then fill the "sync: false"
# secrets in the dashboard (they are never stored in git).
services:
  - type: web
    name: fritz-ev-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: DB_INIT_MODE
        value: never
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://fritz-ev-web.onrender.com

  - type: web
    name: fritz-ev-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # e.g. https://fritz-ev-api.onrender.com
    routes:
      - type: rewrite        # single-page app: let React Router handle every path
        source: /*
        destination: /index.html
